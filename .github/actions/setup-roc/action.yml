name: Install the latest Roc nightly
description: Install the latest published new-compiler nightly; this repository does not pin the package compiler

runs:
  using: composite
  steps:
    - uses: roc-lang/setup-roc@66d1ae2def87ec77b8670e9ac09c418df2f18c86
      with:
        version: nightly-new-compiler

    - name: Print the Roc version
      shell: bash
      run: roc version
