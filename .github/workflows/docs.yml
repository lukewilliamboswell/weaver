name: Deploy site and docs to Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "Blueprint.lock"
      - "Blueprint.roc"
      - "examples/**"
      - "package/**"
      - "scripts/build_docs.roc"
      - "scripts/src/**"
      - "tests/spec.json"
      - "www/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site and docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Roc
        uses: ./.github/actions/setup-roc

      - name: Install tooling
        uses: ./.github/actions/setup-tooling

      - name: Assemble Pages site
        env:
          DOCS_OUTPUT: pages-site
          ROC_DOCS_URL_ROOT: /${{ github.event.repository.name }}/main
        run: blueprint run build-docs

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: pages-site

      - name: Deploy docs
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
