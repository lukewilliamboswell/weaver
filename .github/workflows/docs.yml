name: Deploy site and docs to Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - ".roc-version"
      - "examples/**"
      - "package/**"
      - "scripts/build_docs_site.py"
      - "scripts/enhance_docs_site.py"
      - "scripts/generate_example_pages.py"
      - "scripts/test_spec.json"
      - "www/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site and docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Roc
        uses: ./.github/actions/setup-roc

      - name: Assemble Pages site
        env:
          DOCS_OUTPUT: pages-site
          ROC_DOCS_URL_ROOT: /${{ github.event.repository.name }}/main
        shell: python
        run: import runpy; runpy.run_path("scripts/build_docs_site.py", run_name="__main__")

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

      - name: Deploy docs
        id: deployment
        uses: actions/deploy-pages@v4
