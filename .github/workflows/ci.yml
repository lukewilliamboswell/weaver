name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test
        required: false
        type: string
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: "Validate a nightly candidate without publishing or deploying"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: package examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Roc
        uses: ./.github/actions/setup-roc

      - name: Install tooling
        uses: ./.github/actions/setup-tooling

      - name: Run checks
        if: runner.os != 'Windows'
        run: blueprint run check

      - name: Run checks without Blueprint
        if: runner.os == 'Windows'
        shell: bash
        run: roc-stable scripts/check_all.roc
