name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: package examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Roc
        uses: ./.github/actions/setup-roc

      - name: Install tooling
        uses: ./.github/actions/setup-tooling

      - name: Run checks
        if: runner.os != 'Windows'
        run: blueprint run check

      - name: Run checks without Blueprint
        if: runner.os == 'Windows'
        shell: bash
        run: roc-stable scripts/check_all.roc
