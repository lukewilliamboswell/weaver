name: Update Roc nightly

on:
  schedule:
    # Roc nightlies are normally published around 10:30 UTC.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      nightly_tag:
        description: "Nightly tag to use instead of the latest published tag"
        required: false
        type: string

permissions: {}

concurrency:
  group: update-roc-nightly
  cancel-in-progress: false

env:
  UPDATE_BRANCH: update-roc-nightly

jobs:
  bump:
    name: Update nightly pin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      nightly_tag: ${{ steps.latest.outputs.nightly_tag }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4

      - name: Resolve Roc nightly
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.nightly_tag || '' }}
        run: |
          set -euo pipefail

          nightly_tag="$REQUESTED_TAG"
          if [ -z "$nightly_tag" ]; then
            nightly_tag="$(gh release view --repo roc-lang/nightlies --json tagName --jq .tagName)"
          fi

          if [[ ! "$nightly_tag" =~ ^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{7}$ ]]; then
            echo "Invalid Roc nightly tag: $nightly_tag" >&2
            exit 1
          fi

          echo "nightly_tag=$nightly_tag" >> "$GITHUB_OUTPUT"

      - name: Update pin and push branch
        id: bump
        env:
          NIGHTLY_TAG: ${{ steps.latest.outputs.nightly_tag }}
        run: |
          set -euo pipefail

          if [ "$NIGHTLY_TAG" = "$(<.roc-version)" ]; then
            echo "Already pinned to $NIGHTLY_TAG; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "$NIGHTLY_TAG" > .roc-version
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --create "$UPDATE_BRANCH"
          git add .roc-version
          git commit --message "Update Roc nightly pin to $NIGHTLY_TAG"
          git push --force origin "$UPDATE_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  test:
    name: Test nightly update
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: update-roc-nightly

  pull-request:
    name: Open nightly update PR
    needs: [bump, test]
    if: always() && needs.bump.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Open or refresh update PR
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_TAG: ${{ needs.bump.outputs.nightly_tag }}
          TEST_RESULT: ${{ needs.test.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "$TEST_RESULT" = success ]; then
            status=":white_check_mark: The complete Linux, macOS, and Windows test matrix passed."
          else
            status=":x: The test matrix finished with status \`$TEST_RESULT\`; this update needs attention before merging."
          fi

          title="Update Roc nightly pin to $NIGHTLY_TAG"
          body="$(printf '%s\n\n%s\n\n%s\n' \
            "Updates \`.roc-version\` to [\`$NIGHTLY_TAG\`](https://github.com/roc-lang/nightlies/releases/tag/$NIGHTLY_TAG)." \
            "$status See the [workflow run]($RUN_URL)." \
            "This PR was created automatically by the \`Update Roc nightly\` workflow.")"
          pr="$(gh pr list --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number // empty')"

          if [ -z "$pr" ]; then
            gh pr create --head "$UPDATE_BRANCH" --title "$title" --body "$body"
          else
            gh pr edit "$pr" --title "$title" --body "$body"
          fi
