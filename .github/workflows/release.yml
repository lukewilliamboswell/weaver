name: Release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version, e.g. 0.10.0. Leave empty for a dry run."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A pull request or an empty dispatch builds and tests everything a release
  # would publish, under a version that is never published.
  VERSION: ${{ inputs.release_tag || '0.0.1-dry-run' }}

jobs:
  build-bundle:
    name: Build package bundle
    runs-on: ubuntu-latest
    outputs:
      bundle_filename: ${{ steps.bundle.outputs.bundle_filename }}
      archive_filename: ${{ steps.archive.outputs.archive_filename }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Roc
        uses: ./.github/actions/setup-roc

      - name: Install tooling
        uses: ./.github/actions/setup-tooling

      - name: Run checks
        run: blueprint run check

      - name: Bundle package
        id: bundle
        run: |
          blueprint run bundle
          bundles=(dist/*.tar.zst)
          test "${#bundles[@]}" = 1 || { echo "Expected exactly one bundle in dist/" >&2; exit 1; }
          echo "bundle_filename=$(basename "${bundles[0]}")" >> "$GITHUB_OUTPUT"

      - name: Package examples archive
        id: archive
        env:
          BUNDLE_URL: https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/${{ steps.bundle.outputs.bundle_filename }}
        run: |
          blueprint run package-examples
          echo "archive_filename=weaver-examples-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: |
            dist/${{ steps.bundle.outputs.bundle_filename }}
            dist/${{ steps.archive.outputs.archive_filename }}
          if-no-files-found: error
          retention-days: 30

  test-bundle:
    name: Test package bundle (${{ matrix.os }})
    needs: build-bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      BUNDLE_PATH: dist/${{ needs.build-bundle.outputs.bundle_filename }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Roc
        uses: ./.github/actions/setup-roc

      - name: Install tooling
        uses: ./.github/actions/setup-tooling

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: dist

      - name: Unpack examples archive
        shell: bash
        env:
          ARCHIVE: dist/${{ needs.build-bundle.outputs.archive_filename }}
        run: |
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/examples-archive"
          echo "ARCHIVE_DIR=$RUNNER_TEMP/examples-archive/weaver-examples-$VERSION" >> "$GITHUB_ENV"

      - name: Test working-tree examples against the bundle
        if: runner.os != 'Windows'
        run: blueprint run test

      - name: Test the examples archive against the bundle
        if: runner.os != 'Windows'
        run: EXAMPLES_ARCHIVE_DIR="$ARCHIVE_DIR" blueprint run test

      - name: Test working-tree examples against the bundle without Blueprint
        if: runner.os == 'Windows'
        shell: bash
        run: roc-stable scripts/test_examples.roc

      - name: Test the examples archive against the bundle without Blueprint
        if: runner.os == 'Windows'
        shell: bash
        run: EXAMPLES_ARCHIVE_DIR="$(cygpath -m "$ARCHIVE_DIR")" roc-stable scripts/test_examples.roc

  create-release:
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    name: Create GitHub release
    needs:
      - build-bundle
      - test-bundle
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Roc
        uses: ./.github/actions/setup-roc

      - name: Install tooling
        uses: ./.github/actions/setup-tooling

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUNDLE_FILE: dist/${{ needs.build-bundle.outputs.bundle_filename }}
          EXAMPLES_ARCHIVE: dist/${{ needs.build-bundle.outputs.archive_filename }}
        run: blueprint run release
