name: Release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: "Validate a nightly candidate without publishing or deploying"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Release tag, e.g. v0.1.0"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-bundle:
    name: Build package bundle
    runs-on: ubuntu-latest
    outputs:
      bundle_filename: ${{ steps.bundle.outputs.bundle_filename }}
    steps:
      - name: Require a version for publication
        if: github.event_name == 'workflow_dispatch' && !inputs.nightly_validation
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_tag }}
        run: test -n "$RELEASE_VERSION" || { echo "A release version is required for publication" >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Roc
        uses: ./.github/actions/setup-roc

      - name: Install tooling
        uses: ./.github/actions/setup-tooling

      - name: Run checks
        run: blueprint run check

      - name: Bundle package
        id: bundle
        run: |
          blueprint run bundle
          bundles=(dist/*.tar.zst)
          test "${#bundles[@]}" = 1 || { echo "Expected exactly one bundle in dist/" >&2; exit 1; }
          echo "bundle_filename=$(basename "${bundles[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload package bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-bundle
          path: dist/${{ steps.bundle.outputs.bundle_filename }}
          retention-days: 30

  test-bundle:
    name: Test package bundle (${{ matrix.os }})
    needs: build-bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Roc
        uses: ./.github/actions/setup-roc

      - name: Install tooling
        uses: ./.github/actions/setup-tooling

      - name: Download package bundle artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-bundle
          path: dist

      - name: Test examples against downloaded bundle
        if: runner.os != 'Windows'
        env:
          BUNDLE_PATH: dist/${{ needs.build-bundle.outputs.bundle_filename }}
        run: blueprint run test

      - name: Test examples against downloaded bundle without Blueprint
        if: runner.os == 'Windows'
        shell: bash
        env:
          BUNDLE_PATH: dist/${{ needs.build-bundle.outputs.bundle_filename }}
        run: roc-stable scripts/test_examples.roc

  create-release:
    if: github.event_name == 'workflow_dispatch' && !inputs.nightly_validation
    name: Create GitHub release
    needs:
      - build-bundle
      - test-bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download package bundle artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-bundle
          path: dist

      - name: Install Roc
        uses: ./.github/actions/setup-roc

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          BUNDLE_FILE: dist/${{ needs.build-bundle.outputs.bundle_filename }}
        shell: python
        run: import runpy; runpy.run_path("scripts/create_release.py", run_name="__main__")
