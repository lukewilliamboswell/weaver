name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. v0.1.0"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-bundle:
    name: Build package bundle
    runs-on: ubuntu-latest
    outputs:
      bundle_filename: ${{ steps.bundle.outputs.bundle_filename }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # 2.2.1
        with:
          version: 0.16.0
          use-cache: false

      - name: Install Roc
        uses: ./.github/actions/setup-roc

      - name: Check format and package
        shell: python
        run: import runpy; runpy.run_path("scripts/check_package.py", run_name="__main__")

      - name: Bundle package
        id: bundle
        shell: python
        run: import runpy; runpy.run_path("scripts/build_release_bundle.py", run_name="__main__")

      - name: Upload package bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-bundle
          path: dist/${{ steps.bundle.outputs.bundle_filename }}
          retention-days: 30

  test-bundle:
    name: Test package bundle (${{ matrix.os }})
    needs: build-bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # 2.2.1
        with:
          version: 0.16.0
          use-cache: false

      - name: Install Roc
        uses: ./.github/actions/setup-roc

      - name: Download package bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: package-bundle
          path: dist

      - name: Test examples against downloaded bundle
        shell: python
        run: import runpy, sys; sys.argv += ["--bundle-path", "dist/${{ needs.build-bundle.outputs.bundle_filename }}", "--examples-only"]; runpy.run_path("scripts/test.py", run_name="__main__")

  create-release:
    name: Create GitHub release
    needs:
      - build-bundle
      - test-bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: package-bundle
          path: dist

      - name: Install Roc
        uses: ./.github/actions/setup-roc

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          BUNDLE_FILE: dist/${{ needs.build-bundle.outputs.bundle_filename }}
        shell: python
        run: import runpy; runpy.run_path("scripts/create_release.py", run_name="__main__")
